# Shared build hosts: no long-lived Gradle or Kotlin daemons outlive a build.
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# The SDK comes from the runner environment and jobs never install SDK packages; without this,
# AGP would download a missing SDK component on its own when the licences are accepted.
android.builder.sdkDownload=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Golden file names in captureRoboImage() are relative to roborazzi.outputDir (app/src/test/screenshots).
roborazzi.record.filePathStrategy=relativePathFromRoborazziContextOutputDirectory
